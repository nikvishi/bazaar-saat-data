name: daily-fuel
on:
  schedule:
    - cron: "40 1 * * *"   # 07:10 IST, after the 6 am price revision
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fuel.json
        run: python3 fetch_fuel.py
      - name: Commit if changed
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          git add fuel.json
          git diff --cached --quiet || git commit -m "fuel prices $(date -u +%F)"
          git push
